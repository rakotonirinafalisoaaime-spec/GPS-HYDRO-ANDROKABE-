
name: Build GPS HYDRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GPS_HYDRO_Androkabe_GitHubActions.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q GPS_HYDRO_Androkabe_GitHubActions.zip -d project

      - name: Build APK
        run: |
          cd project/GPS_HYDRO_Androkabe
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-HYDRO-Androkabe-APK
          path: project/GPS_HYDRO_Androkabe/app/build/outputs/apk/debug/app-debug.apk
          
